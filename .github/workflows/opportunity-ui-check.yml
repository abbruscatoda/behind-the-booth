name: Opportunity UI typecheck
on:
  pull_request:
    paths:
      - 'src/components/OpportunityBoard.tsx'
      - 'src/lib/opportunities.ts'
      - 'src/lib/opportunityPresentation.ts'
      - '.github/workflows/opportunity-ui-check.yml'
  push:
    paths:
      - 'src/components/OpportunityBoard.tsx'
      - 'src/lib/opportunities.ts'
      - 'src/lib/opportunityPresentation.ts'
      - '.github/workflows/opportunity-ui-check.yml'
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
