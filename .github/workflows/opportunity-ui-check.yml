name: Opportunity UI typecheck
on:
  pull_request:
    paths:
      - 'src/components/OpportunityBoard.tsx'
      - 'src/app/admin/opportunities/page.tsx'
      - 'src/lib/opportunities.ts'
      - 'src/lib/opportunityPresentation.ts'
      - 'src/lib/opportunityFacts.ts'
      - 'src/lib/opportunityCategories.ts'
      - 'src/lib/opportunitySourceLink.ts'
      - 'src/components/OpportunitySourceLink.tsx'
      - 'src/components/OpportunityCard.tsx'
      - 'src/components/OpportunityPreviewCard.tsx'
      - 'src/components/OpportunityVendorRating.tsx'
      - 'src/lib/ratingColors.ts'
      - 'src/components/OpportunityDetailsDialog.tsx'
      - 'scripts/test_opportunity_facts.mjs'
      - 'scripts/test_category_product_scope.mjs'
      - 'supabase/migrations/*category_product_scope.sql'
      - '.github/workflows/opportunity-ui-check.yml'
  push:
    paths:
      - 'src/components/OpportunityBoard.tsx'
      - 'src/app/admin/opportunities/page.tsx'
      - 'src/lib/opportunities.ts'
      - 'src/lib/opportunityPresentation.ts'
      - 'src/lib/opportunityFacts.ts'
      - 'src/lib/opportunityCategories.ts'
      - 'src/lib/opportunitySourceLink.ts'
      - 'src/components/OpportunitySourceLink.tsx'
      - 'src/components/OpportunityCard.tsx'
      - 'src/components/OpportunityPreviewCard.tsx'
      - 'src/components/OpportunityVendorRating.tsx'
      - 'src/lib/ratingColors.ts'
      - 'src/components/OpportunityDetailsDialog.tsx'
      - 'scripts/test_opportunity_facts.mjs'
      - 'scripts/test_category_product_scope.mjs'
      - 'supabase/migrations/*category_product_scope.sql'
      - '.github/workflows/opportunity-ui-check.yml'
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: node --test scripts/test_opportunity_facts.mjs
      - run: node --test scripts/test_category_product_scope.mjs
