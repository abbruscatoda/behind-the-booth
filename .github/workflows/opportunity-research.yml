name: Verify vendor opportunities
on:
  push:
    branches: [main]
    paths:
      - 'scripts/opportunity-research/**'
      - '.github/workflows/opportunity-research.yml'
  schedule:
   - cron: '17 13,16 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview decisions without changing the database'
        required: true
        default: true
        type: boolean
permissions:
  contents: read
# Run only the latest worker code when overlapping pushes occur. Every
# database publishing RPC is atomic and checks source identity/holds, so
# a stopped older run cannot leave a partially written publication.
concurrency:
  group: vendor-opportunity-research
  cancel-in-progress: true
jobs:
  verify:
    # Playwright --with-deps requires the stable font package set; ubuntu-latest
    # moved to Ubuntu 26.04 where fonts-unifont and related packages are absent.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check verifier rules
        run: python3 -m unittest discover -s scripts/opportunity-research -p 'test_*.py'
      - name: Install read-only Chromium fallback
        run: |
          python3 -m pip install --disable-pip-version-check 'playwright>=1.56,<2' 'pypdf==5.9.0'
          python3 -m playwright install --with-deps chromium
      - name: Verify official sources
        env:
          BTB_SUPABASE_URL: ${{ secrets.BTB_SUPABASE_URL }}
          BTB_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.BTB_SUPABASE_PUBLISHABLE_KEY }}
          BTB_RESEARCH_SECRET: ${{ secrets.BTB_RESEARCH_SECRET }}
          BTB_BROWSER_FALLBACK: '1'
          BTB_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        shell: bash
        run: |
          if [ "$BTB_DRY_RUN" = "true" ]; then
            python3 scripts/opportunity-research/run.py --dry-run
          else
            python3 scripts/opportunity-research/run.py
          fi
