name: Inspect public winter craft application fees
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/winter-craft-form-read.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-form-read:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install read-only Chromium
        run: |
          python3 -m pip install --disable-pip-version-check 'playwright>=1.56,<2' 'pypdf==5.9.0'
          python3 -m playwright install --with-deps chromium
      - name: Inspect official public form and current fee evidence
        run: python3 scripts/opportunity-research/probe_winter_form.py

      - name: Publish vetted event to live database using evidence guard
        env:
          BTB_SUPABASE_URL: ${{ secrets.BTB_SUPABASE_URL }}
          BTB_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.BTB_SUPABASE_PUBLISHABLE_KEY }}
          BTB_RESEARCH_SECRET: ${{ secrets.BTB_RESEARCH_SECRET }}
        run: |
          python3 - <<'PY'
          import json,sys
          sys.path.insert(0,'scripts/opportunity-research')
          from verifier import Fetcher
          from western_craft_fair import verify_western_craft
          from run import Database
          receipt=verify_western_craft(Fetcher(limit=12))
          response=Database().rpc('btb_research_publish_western_craft',{'p_result':receipt})
          print('WESTERN_CRAFT_PUBLISH '+json.dumps(response))
          if response.get('action')!='publish':raise RuntimeError('Verified craft publisher did not confirm update')
          PY
