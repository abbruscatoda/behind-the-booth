name: Sync reviewed discovery sources
on:
  push:
    branches: [main]
    paths:
      - 'scripts/opportunity-research/discovery.py'
      - 'scripts/opportunity-research/community_discovery.py'
      - 'scripts/opportunity-research/community_sources.json'
      - 'scripts/test_community_discovery.mjs'
      - 'supabase/migrations/*community_vendor_discovery.sql'
      - 'scripts/opportunity-research/run.py'
      - 'scripts/opportunity-research/sync_sources.py'
      - 'scripts/opportunity-research/independent_markets.py'
      - 'scripts/opportunity-research/market_catalog.py'
      - 'scripts/test_independent_market_publication.mjs'
      - 'supabase/migrations/*independent_market_discovery.sql'
      - '.github/workflows/discovery-sources.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reviewed-discovery-source-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check verifier rules
        run: python3 -m unittest discover -s scripts/opportunity-research -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check database publication guards
        run: node --test scripts/test_independent_market_publication.mjs scripts/test_community_discovery.mjs
      - name: Synchronize reviewed sources
        env:
          BTB_SUPABASE_URL: ${{ secrets.BTB_SUPABASE_URL }}
          BTB_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.BTB_SUPABASE_PUBLISHABLE_KEY }}
          BTB_RESEARCH_SECRET: ${{ secrets.BTB_RESEARCH_SECRET }}
        run: python3 scripts/opportunity-research/sync_sources.py
